[package]
name = "flashbee"
version = "0.2.0"
description = "A calm, native multi-repository Git viewer"
authors = ["wangzhuo"]
edition = "2021"
license = "MIT"
repository = "https://github.com/imi4u36d/flashbee"
rust-version = "1.77.2"

[lib]
name = "flashbee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sys-locale = "0.3"
