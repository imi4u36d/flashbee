[package]
name = "flashbee"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A calm, native multi-repository Git viewer for macOS"

[[bin]]
name = "flashbee"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
flashbee-git = { path = "../flashbee-git" }
dirs = "6"
open = "5"
sys-locale = "0.3"
unicode-segmentation = "1"
